<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Менеджер задач{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="{% url 'tasks:list' %}" class="logo">Менеджер задач</a>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <span class="user-info">Привет, <strong>{{ user.username }}</strong>!</span>
                    <form action="{% url 'logout' %}" method="post" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-primary">Войти</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container main-content">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Учебная практика. Django.</p>
        </div>
    </footer>
</body>
</html>
